# Render Blueprint — 1 repo (npm workspaces monorepo) => 2 Web Services.
#
# rootDir is intentionally NOT set: package-lock.json / node_modules live at the
# repo root, and apps/* depend on the workspace package "@thuong-ielts/db": "*",
# which only resolves when npm installs from the root. Each service instead
# picks its app via the build/start command.
#
# Secrets (sync: false) are NOT read from this file — set them once in the
# Render dashboard per service. Do not commit real credentials here.

services:
  - type: web
    name: thuong-ielts-web
    runtime: node
    plan: starter
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build:web
    startCommand: npm run start --workspace=apps/web
    healthCheckPath: /
    # Only redeploy when code this app actually uses changes.
    buildFilter:
      paths:
        - apps/web/**
        - packages/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PGHOST
        sync: false
      - key: PGPORT
        value: "5432"
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGDATABASE
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_URL
        sync: false

  - type: web
    name: thuong-ielts-admin
    runtime: node
    plan: starter
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build:admin
    # `node server.js`, không phải `next start`: Next không nhận được yêu cầu
    # nâng cấp lên WebSocket trong route handler, nên Socket.IO cần một HTTP
    # server tự cầm với Next chạy bên trong. Xem apps/admin/server.js.
    startCommand: npm run start --workspace=apps/admin
    healthCheckPath: /login
    buildFilter:
      paths:
        - apps/admin/**
        - packages/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PGHOST
        sync: false
      - key: PGPORT
        value: "5432"
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGDATABASE
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false

  # Hai việc dọn dẹp, chung một cron cho đỡ thêm một service:
  #   1. chốt những lượt hết giờ mà không ai bấm nộp
  #   2. dọn khách vãng lai quá 1 ngày
  #
  # Chốt những lượt hết giờ mà không ai bấm nộp — học sinh đóng tab giữa chừng,
  # máy sập nguồn, mạng rớt hẳn. Không có việc này thì bảng lớp của cô mang theo
  # những em không còn ở đó, và lịch sử làm bài thiếu mất bài đã làm dở.
  #
  # 10 phút một lần là đủ: lượt quá hạn không gấp, và chạy dày hơn chỉ tốn thêm
  # kết nối tới RDS mà không ai được lợi.
  - type: cron
    name: thuong-ielts-chot-luot
    runtime: node
    plan: starter
    region: singapore
    branch: main
    schedule: "*/10 * * * *"
    buildCommand: npm ci
    startCommand: npm run close:expired && npm run clean:guests
    buildFilter:
      paths:
        - scripts/**
        - apps/web/src/features/practice/domain/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PGHOST
        sync: false
      - key: PGPORT
        value: "5432"
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGDATABASE
        sync: false
